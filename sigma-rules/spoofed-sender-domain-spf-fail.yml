title: Email with Spoofed Sender Domain (SPF Fail)
id: 4f1e2a8c-7b3d-4e9f-a1c2-8d5b6e9f0a3c
status: experimental
description: Detects inbound emails where the SPF check has failed, indicating the sending server was not authorized to send on behalf of the claimed sender domain — a common indicator of sender spoofing in phishing/BEC attacks.
references:
    - https://attack.mitre.org/techniques/T1566/001/
author: Gabriel García Villegas
date: 2026/08/06
tags:
    - attack.initial_access
    - attack.t1566.001
    - attack.defense_evasion
logsource:
    category: email
detection:
    selection:
        spf_result: 'fail'
    condition: selection
falsepositives:
    - Legitimate email forwarding services that preserve the original sender address
    - Mailing lists that don't rewrite the sender domain
level: medium
