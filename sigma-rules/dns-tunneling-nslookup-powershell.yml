title: Potential DNS Tunneling via PowerShell-Spawned Nslookup
id: 6a2d8f4e-3c1b-4a9d-8e7f-1b5c9d2a4e6f
status: experimental
description: >
    Detects nslookup.exe spawned by powershell.exe with a command line containing a long
    encoded-looking string (consistent with Base64) prepended to an external domain.
    This pattern was observed in a real investigated incident where an attacker used
    nslookup DNS queries to exfiltrate Base64-encoded data to an attacker-controlled
    domain (DNS tunneling), split across multiple queries to stay under DNS length limits.
references:
    - https://attack.mitre.org/techniques/T1048/003/
    - https://attack.mitre.org/techniques/T1071/004/
    - tryhackme.com/soc-sim/scenarios?scenario=phishing-unfolding-v2 (case source)
author: Gabriel García Villegas
date: 2026/08/06
tags:
    - attack.exfiltration
    - attack.t1048.003
    - attack.command_and_control
    - attack.t1071.004
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith: '\powershell.exe'
        Image|endswith: '\nslookup.exe'
    selection_encoded_pattern:
        CommandLine|re: '[A-Za-z0-9+/]{20,}={0,2}\.[a-z0-9-]+\.[a-z]{2,}'
    condition: selection and selection_encoded_pattern
falsepositives:
    - Legitimate network troubleshooting scripts that pass long hostnames or tokens to nslookup
    - Automated monitoring tools invoking nslookup from a PowerShell wrapper script
level: high
